#cloud-config
package_update: true
packages:
  - python3-venv
  - python3-pip
  - jq
users:
  - default
  - name: demo
    system: true
    shell: /usr/sbin/nologin
    home: /opt/tableflow-demo
runcmd:
  - install -d -o demo -g demo /opt/tableflow-demo /opt/tableflow-demo/app
  - sudo -u demo python3 -m venv /opt/tableflow-demo/venv
